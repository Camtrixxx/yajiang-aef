experiment:
  name: aef_hyh_yajiang_v1_2
  seed: 42
  output_dir: outputs/aef_hyh_yajiang_v1_2

data:
  dataset_type: yajiang_open
  manifest_path: data/full_npy/train.jsonl
  stats_dir: data/statistics/yajiang_open

  batch_size: 4
  # 2 is per-rank, so 8 cards run 16 loader workers total -- NOT 8 per card.
  # Measured on 8 cards (loader wait / epoch): nw=8 7.71s/27.0s, nw=4 1.70s/21.0s,
  # nw=2 0.75s/20.1s, nw=1 2.58s/22.4s. There is a real optimum: above it the
  # workers contend (64 workers on 64 physical cores made a loader-only pass 9.4x
  # slower than 1 rank alone) and also starve the main process that issues CUDA
  # kernels (in-epoch compute 23.14s -> 19.18s); below it one worker cannot keep up.
  # Rule of thumb here: total workers ~16, i.e. num_workers ~= 16 / nproc_per_node.
  # Warm-cache result -- the 12.64 GB dataset sits in page cache, so workers only
  # parallelize CPU transforms. With cold reads (national scale) they must also hide
  # IO latency and the optimum moves up; re-measure rather than reusing 2.
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 4
  drop_last: true
  image_size: 128
  # All 1708 manifest records hold exactly 13 frames for every source (s2/s1/
  # landsat, verified over the full manifest), so slots 14-16 were always empty:
  # 18.75% of the time-axis compute ran on guaranteed-zero data. Dropping them is
  # lossless HERE and worth 1.230x on 8 cards (501.5 -> 407.7 ms/step).
  # REQUIRES model.stem_norm=group -- under BatchNorm the empty slots enter the
  # batch statistics, so this same change moves the loss by |dloss| 8.3e-02.
  # At national scale frame counts vary by region; this must become variable-length
  # packing rather than a smaller constant.
  max_frames: 13
  num_samples: 0

  metadata_dim: 4

  input_sources:
    - s2
    - s1
    - landsat

  source_preprocessing:
    s2:
      fit: crop_pad
      normalization: standardize
      clip: [0.0, 10000.0]
      mean: 4934.0
      std: 1315.0
    s1:
      fit: crop_pad
      normalization: standardize
      mean: -11.0
      std: 4.7
    landsat:
      fit: resize
      normalization: standardize
      clip: [0.0, 50000.0]
      mean: 21036.0
      std: 5481.0

  target_sources:
    - name: dem
      loss_type: continuous
      out_channels: 1
    - name: worldcover
      loss_type: categorical
      out_channels: 9
    - name: jrc_water
      loss_type: categorical
      out_channels: 101

model:
  input_dim: 6
  stem_dim: 128
  precision_dim: 256
  embedding_dim: 128

  time_code_dim: 64
  window_code_dim: 64
  relative_time_code_dim: 16

  metadata_dim: 4

  num_blocks: 4
  num_heads: 4

  # Mathematically equivalent replacement for nn.MultiheadAttention (verified to
  # max|diff| 5.1e-07, identical state_dict keys, old checkpoints load strict=True).
  # On top of compile it buys 1.038x speed but 13.5% less peak memory (28.38 ->
  # 24.56 GB) -- the memory is the real argument, since it is what lets batch_size
  # grow. Standalone (no compile) it is 1.087x.
  fast_attention: true

  # Fixes BatchNorm statistics being polluted by all-zero padded frame slots
  # (max_frames sensitivity 8.3e-02 -> 9.5e-07). Speed-neutral on its own
  # (500.5 vs 501.5 ms on 8 cards, inside the 3.5 ms spread) -- it is enabled
  # because it is what makes data.max_frames=13 sound, and that is worth 1.230x.
  # NOT checkpoint-compatible: drops 18 BatchNorm running-stat keys, so weights in
  # outputs/aef_hyh_yajiang_v1_2/ will not load into this config and runs from here
  # form a new lineage. Set back to "batch" (with max_frames: 16) to reproduce v1.2.
  stem_norm: group

  vmf_kappa: 2000.0
  skip_l2_training: true
  use_time_codes: false
  gradient_checkpointing: false
  decoder_hidden_mult: 1

  source_channels:
    s2: 6
    s1: 2
    landsat: 6

training:
  epochs: 50
  amp: true
  amp_dtype: bf16
  lr: 0.0001
  weight_decay: 0.01
  grad_clip_norm: 1.0
  log_interval: 20
  allow_tf32: true
  matmul_precision: high
  cudnn_benchmark: true
  find_unused_parameters: false

  save_epoch_checkpoints: false
  save_every: 0

  reconstruction_weight: 1.0
  target_loss_weights:
    dem: 0.5
    worldcover: 2.0
    jrc_water: 0.5

  class_weights:
    worldcover: [0.3, 0.8, 4.0, 4.0, 1.5, 0.8, 2.0, 1.2, 4.0]

  uniformity_weight: 0.001
  variance_weight: 0.001
  decorrelation_weight: 0.0001
  orthogonality_weight: 0.0001

evaluation:
  knn_k: 5
